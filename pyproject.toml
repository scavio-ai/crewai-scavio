[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crewai-scavio"
version = "0.8.0"
description = "CrewAI integration for Scavio Search API -- 188 real-time search tools for AI agents across Google, Amazon, Walmart, eBay, Target, Home Depot, YouTube, Reddit, TikTok, Instagram, X, LinkedIn, Threads, Kuaishou, Zillow, Redfin, Booking.com, Airbnb, Tripadvisor, Yelp, Indeed, Glassdoor, the App Store, Google Play, SEC EDGAR, Companies House, G2, Capterra, Google Ads and the Meta Ad Library"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.14"
authors = [{ name = "Scavio" }]
keywords = [
    "crewai",
    "search",
    "ai",
    "agents",
    "web-search",
    "scavio",
    "amazon-search",
    "walmart-search",
    "youtube-search",
    "reddit-search",
    "tiktok-search",
    "instagram-search",
    "x-search",
    "linkedin-search",
    "ebay-search",
    "zillow-api",
    "yelp-api",
    "indeed-api",
    "glassdoor-api",
    "app-store-scraper",
    "google-play-scraper",
    "sec-edgar",
    "g2-reviews",
    "meta-ad-library",
    "web-scraping",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Typing :: Typed",
]

dependencies = [
    "crewai>=1.14.0",
    "scavio>=0.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://scavio.dev?utm_source=crewai_integration"
Repository = "https://github.com/scavio-ai/crewai-scavio"
Documentation = "https://scavio.dev/docs/crewai?utm_source=crewai_integration"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint]
select = ["E", "F", "I"]
